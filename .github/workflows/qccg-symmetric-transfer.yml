name: QCCG symmetric transfer extraction

on:
  pull_request:
    paths:
      - "qccg/run_qccg_symmetric_transfer_extraction.py"
      - "qccg/run_qccg_fixed_volume_curvature_thermalization.py"
      - "qccg/run_qccg_equilibrated_critical_line.py"
      - "qccg/run_qccg_curvature_weighted_time_exploration.py"
      - "qccg/theorygate.yaml"
      - "requirements.txt"
      - ".github/workflows/qccg-symmetric-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build and fit symmetric coarse transfer kernel
        run: |
          mkdir -p artifacts/qccg-symmetric-transfer
          python qccg/run_qccg_symmetric_transfer_extraction.py \
            --out artifacts/qccg-symmetric-transfer/evidence.json
      - name: Validate TheoryGate model
        run: theorygate validate qccg/theorygate.yaml
      - name: Promote only the mesoscopic diagnostic
        run: |
          theorygate check qccg/theorygate.yaml \
            --evidence artifacts/qccg-symmetric-transfer/evidence.json \
            --require QCCG_MESOSCOPIC_TRANSFER_DIAGNOSTIC_TOY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qccg-symmetric-transfer
          path: artifacts/qccg-symmetric-transfer/
